# Cascading Labs: Vite+ validation

name: Check (Vite+)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  check:
    name: Format, lint, types, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Vite+ and Astro checks
        run: ./node_modules/.bin/vp run check

      - name: Build
        run: ./node_modules/.bin/vp run build

      - name: Check QSN
        run: ./node_modules/.bin/vp run news:check

      - name: Verify QSN fixture
        run: ./node_modules/.bin/vp run news:verify

      - name: Build QSN
        run: ./node_modules/.bin/vp run news:build

      - name: Audit generated QSN routes
        run: ./node_modules/.bin/vp run news:audit-output

      - name: Smoke test news network HTTP
        run: ./node_modules/.bin/vp run news:smoke

      - name: Pack news network preview
        if: github.event_name == 'pull_request'
        run: tar -czf news-network-preview.tar.gz -C qsn/dist .

      - name: Upload news network preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: news-network-preview
          path: news-network-preview.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key

  - repo: local
    hooks:
      - id: vite-plus-check
        name: Vite+ format and lint check
        entry: bun run check
        language: system
        pass_filenames: false
        files: \.(js|ts|cjs|mjs|jsx|tsx|json|jsonc|css|astro|svelte|vue|md|yaml|yml)$
        stages: [pre-commit]

      - id: vite-plus-ci-check
        name: Vite+ format and lint check
        entry: bun run check
        language: system
        pass_filenames: false
        files: \.(js|ts|cjs|mjs|jsx|tsx|json|jsonc|css|astro|svelte|vue|md|yaml|yml)$
        stages: [manual]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit, manual]

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.2
    hooks:
      - id: commitizen
        stages: [commit-msg]
